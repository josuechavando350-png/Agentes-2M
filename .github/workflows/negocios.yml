name: Examen comercial histórico
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/negocios.yml'
      - 'scripts/business/**'
      - 'src/business.mjs'
      - 'src/account-market.mjs'
permissions:
  contents: read
concurrency:
  group: examen-comercial-semar
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install openpyxl==3.1.5
          curl -fsSL --retry 3 --max-time 90 'https://archive.ics.uci.edu/static/public/352/online+retail.zip' -o /tmp/uci.zip
          python scripts/business/prepare.py /tmp/uci.zip datos
          node scripts/business/exam.mjs train datos
      - uses: actions/upload-artifact@v4
        with:
          name: expediente-ciego
          path: |
            datos/test-cases.json
            datos/model.json
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with: {name: desenlaces, path: datos/test-outcomes.json, retention-days: 5}
  decidir:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci && npm run setup
      - uses: actions/download-artifact@v4
        with: {name: expediente-ciego, path: datos}
      - run: node scripts/business/exam.mjs predict datos
      - uses: actions/upload-artifact@v4
        with:
          name: decisiones-congeladas
          path: |
            datos/predictions.json
            datos/human-packet.json
          retention-days: 30
  calificar:
    needs: decidir
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {name: decisiones-congeladas, path: datos}
      - uses: actions/download-artifact@v4
        with: {name: expediente-ciego, path: datos}
      - uses: actions/download-artifact@v4
        with: {name: desenlaces, path: datos}
      - run: node scripts/business/exam.mjs grade datos
      - uses: actions/upload-artifact@v4
        with:
          name: dictamen-comercial
          path: |
            datos/negocios.json
            datos/account-policy.json
          retention-days: 30
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: calificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {path: evidencia}
      - uses: actions/download-artifact@v4
        with: {name: dictamen-comercial, path: informe}
      - name: Registrar dictamen y modelo evaluado
        working-directory: evidencia
        run: |
          set -eu
          ref=refs/heads/evidencia-negocios
          if test -n "$(git ls-remote --heads origin "$ref")"; then
            git fetch origin "$ref"
            git switch -c evidencia-negocios FETCH_HEAD
          else
            git switch --orphan evidencia-negocios
          fi
          cp ../informe/negocios.json ../informe/account-policy.json .
          git add -- negocios.json account-policy.json
          git config user.name 'SEMAR Escuela'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Registrar decisiones congeladas y desenlaces comerciales'
          git push origin "HEAD:$ref"
