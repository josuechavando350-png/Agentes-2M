name: Escuela continua SEMAR
on:
  schedule:
    - cron: '17 10 * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/academy.yml', 'scripts/cycle.mjs', 'src/research.mjs', 'src/mission-cycle.mjs', 'src/teams.mjs', 'src/dossiers.mjs', 'scripts/equipos.mjs', 'src/missions.mjs', 'native/**', 'src/native.mjs', 'src/packed.mjs', 'src/ledger.mjs', 'src/semar.mjs', 'scripts/latencia.mjs']
concurrency:
  group: escuela-semar-persistente
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  evolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: state
          ref: estado-semar
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run setup && npm test
        working-directory: engine
      - run: |
          if [ "$SCHEDULE" = '37 * * * *' ]; then
            node scripts/cycle.mjs ../state/escuela --pulse --public-feed
          else
            node scripts/cycle.mjs ../state/escuela --public-feed
          fi
        env:
          SCHEDULE: ${{ github.event.schedule }}
        working-directory: engine
      - name: Materializar el padrón y medir acciones confirmadas
        if: github.event.schedule != '37 * * * *'
        working-directory: engine
        run: node scripts/latencia.mjs ../state/escuela
      - name: Comparar equipos en expedientes inéditos
        if: github.event.schedule != '37 * * * *'
        working-directory: engine
        run: node scripts/equipos.mjs ../state/escuela
      - name: Guardar únicamente el estado auditado
        working-directory: state
        run: |
          git add -- escuela/avance.json escuela/bitacora.json.gz escuela/censo-100m.json escuela/mando.json
          if test -f escuela/latencia.json; then
            git add -- escuela/latencia.json escuela/padron-100m.bin.gz
          fi
          if test -f escuela/equipos.json; then git add -- escuela/equipos.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'SEMAR Escuela'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Registrar ciclo de aprendizaje auditado'
            git push origin HEAD:refs/heads/estado-semar
          fi
