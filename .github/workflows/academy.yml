name: Escuela continua SEMAR
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/academy.yml']
concurrency:
  group: escuela-semar-persistente
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  evolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: state
          ref: estado-semar
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run setup && npm test
        working-directory: engine
      - run: node scripts/cycle.mjs ../state/escuela
        working-directory: engine
      - name: Guardar únicamente el estado auditado
        working-directory: state
        run: |
          git add -- escuela/avance.json escuela/bitacora.json.gz
          if ! git diff --cached --quiet; then
            git config user.name 'SEMAR Escuela'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Registrar ciclo de aprendizaje auditado'
            git push origin HEAD:refs/heads/estado-semar
          fi
