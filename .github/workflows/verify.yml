name: Auditoría SEMAR
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run demo
      - run: node scripts/check-evidence.mjs
      - name: Examinar decisiones concurrentes con una semilla nueva
        run: node scripts/global/exam.mjs > examen-global.json
      - uses: actions/upload-artifact@v4
        with: {name: examen-global, path: examen-global.json, retention-days: 30}

      - name: Construir y ejecutar el producto local con Internet bloqueado
        run: python3 scripts/factory/offline.py node scripts/factory/exam.mjs entrega-fabrica > examen-fabrica.json
      - name: Reproducir el examen histórico de Iowa
        run: |
          node scripts/factory/public.mjs freeze "$RUNNER_TEMP/iowa.json"
          node scripts/factory/public.mjs grade "$RUNNER_TEMP/iowa.json" > "$RUNNER_TEMP/dictamen.json"
          diff evidence/factory-iowa-result.json "$RUNNER_TEMP/dictamen.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fabrica-semar
          path: |
            entrega-fabrica/
            examen-fabrica.json
          retention-days: 30
      - uses: actions/checkout@v4
        with: {path: version-anterior, ref: 9d86438df8cbb2c4d9c8d3ee1719617cd205d680, persist-credentials: false}
      - name: Conciliar un reembolso posterior en una base creada por la versión publicada
        run: |
          mkdir -p version-anterior/.cache
          cp .cache/nexus.mjs .cache/semar-native version-anterior/.cache/
          python3 scripts/factory/offline.py node scripts/sale/upgrade-exam.mjs verify version-anterior > actualizacion-libro.json
          diff evidence/sale-upgrade.json actualizacion-libro.json
      - name: Empaquetar el auditor del comprador y probar pedidos, cobros y reembolsos
        run: |
          python3 scripts/factory/offline.py node scripts/sale/package.mjs entrega-ventas
          python3 scripts/sale/distribution.py entrega-ventas "$RUNNER_TEMP/auditor-creditos.zip"
          cmp entregas/auditor-creditos.zip "$RUNNER_TEMP/auditor-creditos.zip"
          python3 scripts/factory/offline.py node scripts/sale/price-exam.mjs > limites-de-precio.json
          node scripts/sale/check-result.mjs pricing limites-de-precio.json evidence/sale-pricing.json
          python3 scripts/factory/offline.py node scripts/sale/pilot.mjs > demostracion-ventas.json
          python3 scripts/factory/offline.py node scripts/sale/cash-stress.mjs run concurrencia-ventas.json 5
          python3 scripts/factory/offline.py node scripts/sale/field-acceptance.mjs > aceptacion-de-campo.json
          diff evidence/sale-field-acceptance.json aceptacion-de-campo.json
          node src/cli.mjs sale-scorecard > dictamen-de-ventas.json
      - uses: actions/upload-artifact@v4
        with:
          name: auditor-notas-de-credito
          path: entrega-ventas/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pruebas-flujo-comercial
          path: |
            demostracion-ventas.json
            concurrencia-ventas.json
            aceptacion-de-campo.json
            actualizacion-libro.json
            limites-de-precio.json
            dictamen-de-ventas.json
          retention-days: 30
